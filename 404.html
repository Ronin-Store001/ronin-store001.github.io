<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <meta name="robots" content="noindex,follow">
  <title>صفحه پیدا نشد — رونین استور</title>
  <link rel="icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Vazirmatn,system-ui,sans-serif;
      color:#eef2ff;background:
        radial-gradient(900px 520px at 82% -10%,rgba(124,92,255,.3),transparent 62%),
        radial-gradient(760px 480px at 8% 4%,rgba(34,211,238,.2),transparent 64%),#05060f}
    .box{width:min(560px,100%);border-radius:24px;padding:28px 22px;text-align:center;
      border:1px solid rgba(140,160,255,.2);background:rgba(12,16,36,.7);backdrop-filter:blur(18px);
      box-shadow:0 50px 120px -60px rgba(124,92,255,.9)}
    .mark{width:58px;height:58px;margin:0 auto 14px;display:grid;place-items:center;border-radius:18px;font-size:27px;font-weight:900;color:#05060f;
      background:linear-gradient(140deg,#8ef0ff,#7c5cff 55%,#ff5ca8);box-shadow:0 18px 40px -18px rgba(124,92,255,1)}
    h1{margin:0 0 8px;font-size:22px;font-weight:900}
    p{margin:0 0 18px;font-size:12px;line-height:2;color:#a9b3d6}
    .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    a.btn{text-decoration:none;font-size:11.5px;font-weight:900;padding:10px 16px;border-radius:12px}
    a.p{color:#05060f;background:linear-gradient(135deg,#8ef0ff,#7c5cff 60%,#ff5ca8)}
    a.g{color:#dfe6ff;border:1px solid rgba(140,160,255,.28);background:rgba(255,255,255,.05)}
    .foot{margin-top:18px;font-size:10px;color:#6f7aa4}
    .foot a{color:#9fe9ff;text-decoration:none}
  </style>
</head>
<body>
  <main class="box">
    <div class="mark">忍</div>
    <h1>این صفحه پیدا نشد</h1>
    <p>آدرسی که زدی وجود ندارد یا جابه‌جا شده. از صفحهٔ اصلی یا کاتالوگ فیلم ادامه بده.</p>
    <div class="btns">
      <a class="btn p" href="/">صفحهٔ اصلی</a>
      <a class="btn g" href="/cinema.html">🎬 رونین فیلم</a>
    </div>
    <div class="foot">
      <a href="/contact.html">تماس</a> · <a href="/terms.html">قوانین</a> · <a href="/privacy.html">حریم خصوصی</a>
    </div>
  </main>
</body>
</html>
