name: Reorganize assets
on:
  push:
    paths: ['.github/workflows/reorganize-assets.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p js
          git mv css/js/1-core.js js/1-core.js
          git mv css/js/js/2-auth.js js/2-auth.js
          git rm css/js/2-auth.js
          git mv css/js/js/js/3-feed.js js/3-feed.js
          git mv css/js/js/js/js/4-chat.js js/4-chat.js
          git mv css/js/js/js/js/js/5-market.js js/5-market.js
          git mv css/js/js/js/js/js/js/6-owner.js js/6-owner.js
          git mv css/js/js/js/js/js/js/js/7-extra.js js/7-extra.js
          git mv css/js/js/js/js/js/js/js/js/8-companion.js js/8-companion.js
          git mv css/js/js/js/js/js/js/js/js/js/9-boot.js js/9-boot.js
          git rm css/css/3-panels.css
          git mv css/css/4-mobile.css css/4-mobile.css
          sed -i 's#css/css/3-panels.css#css/3-panels.css#g; s#css/css/4-mobile.css#css/4-mobile.css#g; s#css/js/1-core.js#js/1-core.js#g; s#css/js/js/2-auth.js#js/2-auth.js#g; s#css/js/js/js/3-feed.js#js/3-feed.js#g; s#css/js/js/js/js/4-chat.js#js/4-chat.js#g; s#css/js/js/js/js/js/5-market.js#js/5-market.js#g; s#css/js/js/js/js/js/js/js/7-extra.js#js/7-extra.js#g; s#css/js/js/js/js/js/js/js/js/8-companion.js#js/8-companion.js#g; s#css/js/js/js/js/js/js/js/js/js/9-boot.js#js/9-boot.js#g' index.html
          sed -i 's/ronin-v20/ronin-v21/' sw.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reorganize CSS and JS assets' -m 'Move core styles into css/ and scripts into js/, update index.html paths and bump the service worker cache to ronin-v21.' -m '🤖 Generated with Codebuff. Co-Authored-By: Codebuff <noreply@codebuff.com>'
          git push origin HEAD:main
