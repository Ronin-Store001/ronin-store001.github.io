name: Merge chat modules
on:
  push:
    paths:
      - chat-src-06.b64
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build merged chat bundle
        run: |
          cat chat-src-*.b64 | tr -d '\n' > /tmp/chat-src.b64
          base64 -d /tmp/chat-src.b64 | tar -xz
          bash merge.sh
