name: Apply Ronin Community v5
on:
  push:
    paths:
      - '.github/workflows/apply-community-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and apply site update
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for url in 'https://litter.catbox.moe/3ww2pn.tgz' 'https://temp.sh/FlWpk/ronin-update.tgz' 'https://d.uguu.se/qoidebpg.tgz'; do
            if curl -fsSL --retry 2 --retry-delay 2 --max-time 40 "$url" -o /tmp/ronin-update.tgz; then ok=1; break; fi
          done
          test "$ok" = 1
          echo '6b28a13cb8330af3e51357c3f79d636532474511726b40eed6b7472c1538a53a  /tmp/ronin-update.tgz' | sha256sum -c -
          rm -rf /tmp/ronin-update && mkdir -p /tmp/ronin-update
          tar -xzf /tmp/ronin-update.tgz -C /tmp/ronin-update
          cp /tmp/ronin-update/index.html ./index.html
          cp /tmp/ronin-update/ronin-i18n.js ./ronin-i18n.js
          cp /tmp/ronin-update/ronin-footer.js ./ronin-footer.js
          cp /tmp/ronin-update/sw.js ./sw.js
          cp /tmp/ronin-update/js/3-feed.js ./js/3-feed.js
          cp /tmp/ronin-update/js/4-chat.js ./js/4-chat.js
          cp /tmp/ronin-update/css/5-community.css ./css/5-community.css
          git config user.name 'Codebuff'
          git config user.email 'noreply@codebuff.com'
          git add index.html ronin-i18n.js ronin-footer.js sw.js js/3-feed.js js/4-chat.js css/5-community.css
          if git diff --cached --quiet; then
            echo 'No file changes to commit'
            exit 0
          fi
          git rm -q .github/workflows/apply-community-v5.yml
          git commit -m 'feat: refresh footer and upgrade community experience' -m 'Redesign the footer around support, extend language switching to the full UI, and add the new community hero, stats, composer, feed tabs and live rail.' -m 'Generated with Codebuff 🤖' -m 'Co-Authored-By: Codebuff <noreply@codebuff.com>'
          git push origin HEAD:main
